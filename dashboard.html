<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>MONEX SOLAR TRACKER</title>

<style>

body{
background:#020817;
font-family:Arial;
margin:0;
padding:0;
color:white;
}

.header{
text-align:center;
padding:20px;
background:#081226;
}

.header h1{
color:#00ff99;
margin:0;
font-size:50px;
}

.header h2{
color:#dddddd;
font-size:22px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#0f172a;
padding:25px;
border-radius:20px;
text-align:center;
}

.label{
font-size:20px;
margin-bottom:10px;
}

.value{
font-size:55px;
color:#00d4ff;
}

.status{
color:#ffb300;
}

.bar-container{
margin:30px;
background:#0f172a;
padding:40px;
border-radius:25px;
}

.bar{
height:12px;
background:linear-gradient(
90deg,
#00ff99,
#ffaa00,
#ff4444
);
border-radius:10px;
position:relative;
margin-top:80px;
}

.pointer{
width:40px;
height:40px;
background:#00d4ff;
border-radius:50%;
position:absolute;
top:-15px;
border:4px solid white;
transition:1s;
}

.footer{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

</style>

</head>

<body>

<div class="header">

<h1>MONEX SOLAR TRACKER</h1>

<h2>WORLDWIDE CLOUD TRACKER</h2>

</div>

<div class="grid">

<div class="card">
<div class="label">LATITUDE</div>
<div class="value" id="lat">0</div>
</div>

<div class="card">
<div class="label">LONGITUDE</div>
<div class="value" id="lon">0</div>
</div>

<div class="card">
<div class="label">STATUS</div>
<div class="value status" id="status">STOPPED</div>
</div>

<div class="card">
<div class="label">CURRENT ANGLE</div>
<div class="value" id="current_angle">0°</div>
</div>

<div class="card">
<div class="label">TARGET ANGLE</div>
<div class="value" id="target_angle">0°</div>
</div>

<div class="card">
<div class="label">MOVEMENTS</div>
<div class="value" id="movements">0</div>
</div>

</div>

<div class="bar-container">

<h1 style="text-align:center">
SOLAR TRACKER POSITION
</h1>

<div class="bar">

<div class="pointer" id="pointer"></div>

</div>

<div style="
display:flex;
justify-content:space-between;
margin-top:20px;
font-size:40px;
">

<div>
EAST<br>+45°
</div>

<div>
CENTER<br>0°
</div>

<div>
WEST<br>-45°
</div>

</div>

</div>

<div class="footer">

<div class="card">
<div class="label">ACTUATOR STROKE</div>
<div class="value" id="stroke">0 mm</div>
</div>

<div class="card">
<div class="label">RUNTIME</div>
<div class="value" id="runtime">0 ms</div>
</div>

<div class="card">
<div class="label">GPS SATELLITES</div>
<div class="value" id="sats">0</div>
</div>

<div class="card">
<div class="label">WIFI RSSI</div>
<div class="value" id="wifi">0</div>
</div>

</div>

<script>

async function loadData()
{
  const response =
  await fetch("/latest");

  const data =
  await response.json();

  document.getElementById("lat").innerHTML =
  Number(data.latitude).toFixed(6);

  document.getElementById("lon").innerHTML =
  Number(data.longitude).toFixed(6);

  document.getElementById("status").innerHTML =
  data.status;

  document.getElementById("current_angle").innerHTML =
  data.current_angle + "°";

  document.getElementById("target_angle").innerHTML =
  data.target_angle + "°";

  document.getElementById("movements").innerHTML =
  data.movement_count;

  document.getElementById("stroke").innerHTML =
  data.actuator_stroke + " mm";

  document.getElementById("runtime").innerHTML =
  data.runtime_ms + " ms";

  document.getElementById("sats").innerHTML =
  data.gps_satellites;

  document.getElementById("wifi").innerHTML =
  data.wifi_rssi + " dBm";

  // POINTER POSITION

  let angle =
  parseFloat(data.current_angle);

  let percent =
  ((45 - angle) / 90) * 100;

  document.getElementById("pointer").style.left =
  `calc(${percent}% - 20px)`;
}

loadData();

setInterval(loadData,3000);

</script>

</body>
</html>
